{% extends "base.html" %}

{% block title %}Sign In - RetailSphere Analytical System{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <!-- Card Header -->
        <div class="auth-header">
            <div class="auth-icon-circle">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to your RetailSphere portal</p>
        </div>

        <!-- Quick Demo Fill Pills -->
        <div class="demo-credentials-box">
            <span class="demo-title"><i class="fa-solid fa-bolt"></i> Quick Demo Logins:</span>
            <div class="demo-buttons">
                <button type="button" class="demo-pill admin-pill" onclick="fillCredentials('admin', 'admin@123')">
                    <i class="fa-solid fa-user-shield"></i> Admin
                </button>
                <button type="button" class="demo-pill cashier-pill" onclick="fillCredentials('cashier', 'cashier@123')">
                    <i class="fa-solid fa-cash-register"></i> Cashier
                </button>
            </div>
        </div>

        <!-- Dynamic Feedback Container for AJAX -->
        <div id="dynamic-alert" class="alert d-none"></div>

        <!-- Login Form -->
        <form id="loginForm" method="POST" action="{{ url_for('login') }}" class="auth-form" novalidate>
            <!-- Username Input -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-group">
                    <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="Enter your username" 
                        value="{{ username or '' }}" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <div class="label-row">
                    <label for="password">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" id="togglePasswordBtn" title="Toggle password visibility">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Role Indicator Preview -->
            <div id="role-preview" class="role-preview-card d-none">
                <span class="role-preview-label">Role Detected:</span>
                <span id="role-preview-badge" class="badge"></span>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
                <span id="btnText"><i class="fa-solid fa-right-to-bracket"></i> Sign In</span>
                <span id="btnSpinner" class="spinner d-none"><i class="fa-solid fa-spinner fa-spin"></i> Authenticating...</span>
            </button>
        </form>

        <!-- Card Footer -->
        <div class="auth-footer">
            <p>Need a new account? <a href="{{ url_for('register') }}" class="link-highlight">Register Here</a></p>
        </div>
    </div>
</div>
{% endblock %}
